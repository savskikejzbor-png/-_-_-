<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <title>Adrese — pojedinačni prikaz</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin:18px; color:#222; background:#fafafa; }
    h1 { margin:0 0 8px 0; }
    p.lead { margin:0 0 18px 0; color:#444; max-width:900px; }
    #controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:12px 0 18px 0; }
    input[type="search"] { padding:8px 10px; border-radius:6px; border:1px solid #ccc; width:260px; }
    select, button { padding:8px 10px; border-radius:6px; border:1px solid #bbb; background:#fff; cursor:pointer; }
    #cards { display:grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap:12px; margin-top:12px; }
    .card { background:#fff; border-radius:8px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
    .addr { font-weight:700; font-size:1.05rem; margin-bottom:6px; }
    .meta { color:#555; font-size:0.95rem; margin-bottom:8px; }
    .badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .badge { padding:6px 8px; border-radius:999px; color:#fff; font-size:0.85rem; }
    .badge.visoka { background:#d9534f; }
    .badge.umerena { background:#f0ad4e; color:#222; }
    .badge.realno { background:#5cb85c; }
    .badge.nestambeni { background:#5bc0de; color:#222; }
    .badge.sporno { background:#6f42c1; }
    .small { font-size:0.85rem; color:#666; }
    .muted { color:#777; font-size:0.9rem; }
    .stat-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .stat { background:#f6f6f8; padding:6px 8px; border-radius:6px; font-weight:600; color:#111; }
    .empty-note { color:#b00; font-weight:600; }
  </style>
</head>
<body>
  <h1>Адресе — појединачни приказ</h1>
  <p class="lead">Филтрирај и прегледај сваку адресу као посебну картицу. Ознаке показују врсту налаза.</p>

  <div id="controls">
    <input id="search" type="search" placeholder="Претрага по адреси или броју бирача" />
    <select id="filterType">
      <option value="">Сви налази</option>
      <option value="visoka koncentracija">Висока концентрација</option>
      <option value="umerena koncentracija">Умерена концентрација</option>
      <option value="deluje realno">Делује реално</option>
      <option value="nestambena adresa">Нестамбени објекат</option>
      <option value="i dalje sporno">И даље спорно</option>
    </select>
    <button id="reload">Учитај NOVI_BEOGRAD_V1.csv</button>
    <div class="muted">Фајл: <strong>NOVI_BEOGRAD_V1.csv</strong></div>
  </div>

  <div id="cards" aria-live="polite"></div>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_NAME = "NOVI_BEOGRAD_V1.csv";

    function normalize(s){ return (s||"").toString().trim(); }

    function findColumn(obj, candidates){
      for(const c of candidates){
        for(const key of Object.keys(obj)){
          if(key.toLowerCase().replace(/\s+/g,'').includes(c.toLowerCase().replace(/\s+/g,''))) return key;
        }
      }
      return null;
    }

    function mapBadges(row){
      // pokušaj prvo iz kolone "Vrste nalaza", pa fallback na sve vrednosti
      const vrsteKey = findColumn(row, ["vrstenalaza","vrste","nalaz","vrste nalaza"]);
      let vrste = vrsteKey ? normalize(row[vrsteKey]).toLowerCase() : Object.values(row).join(" ").toLowerCase();
      const badges = [];
      if(/visoka/i.test(vrste)) badges.push({cls:"visoka", text:"Висока концентрација"});
      if(/umeren|umerena/i.test(vrste)) badges.push({cls:"umerena", text:"Умерена концентрација"});
      if(/delu|делује|realno/i.test(vrste)) badges.push({cls:"realno", text:"Делује реално"});
      if(/nestamben|nestambena|nonres/i.test(vrste)) badges.push({cls:"nestambeni", text:"Нестамбени објекат"});
      if(/sporno|и даље спорно|i dalje sporno/i.test(vrste)) badges.push({cls:"sporno", text:"И даље спорно"});
      if(badges.length===0) badges.push({cls:"realno", text:"Нема ознаке"});
      return badges;
    }

    function renderCard(row){
      const addrKey = findColumn(row, ["column1","адреса","address","column"]);
      const votersKey = findColumn(row, ["biracaukupno","birača","birača ukupno","birača"]);
      const stanovaKey = findColumn(row, ["stanova","stanova","apartments"]);
      const povKey = findColumn(row, ["povrsina","површина","površinaosnove","površinaosnove(m2)"]);
      const tipKey = findColumn(row, ["tipobjekta","tip","tip objekta"]);
      const prebKey = findColumn(row, ["prebivaliste","prebivalište"]);
      const borKey = findColumn(row, ["boraviste","boravište"]);

      const addr = normalize(addrKey ? row[addrKey] : "");
      const voters = normalize(votersKey ? row[votersKey] : "");
      const stanova = normalize(stanovaKey ? row[stanovaKey] : "");
      const pov = normalize(povKey ? row[povKey] : "");
      const tip = normalize(tipKey ? row[tipKey] : "");
      const preb = normalize(prebKey ? row[prebKey] : "");
      const bor = normalize(borKey ? row[borKey] : "");

      const badges = mapBadges(row);

      const card = document.createElement("div");
      card.className = "card";
      card.dataset.addr = addr.toLowerCase();
      card.dataset.voters = voters;
      card.dataset.type = badges.map(b=>b.text.toLowerCase()).join(" ");

      const addrHtml = `<div class="addr">${addr || "<span class='empty-note'>Адреса није унетa</span>"}</div>`;
      const metaHtml = `<div class="meta"><span class="small"><strong>${voters||"—"}</strong> бирача</span> · <span class="small">${stanova? stanova + " станова" : "станови: н/д"}</span></div>`;
      const details = `<div class="stat-row">
        <div class="stat">Пребивалиште: ${preb || "н/д"}</div>
        <div class="stat">Борaвиште: ${bor || "н/д"}</div>
        <div class="stat">Тип: ${tip || "н/д"}</div>
        <div class="stat">Површина: ${pov || "н/д"}</div>
      </div>`;
      const badgesHtml = `<div class="badges">${badges.map(b=>`<span class="badge ${b.cls}">${b.text}</span>`).join("")}</div>`;

      card.innerHTML = addrHtml + metaHtml + details + badgesHtml;
      return card;
    }

    async function loadCSVText(){
      try {
        const r = await fetch(CSV_NAME);
        if(!r.ok) throw new Error("Не могу да учитам фајл");
        return await r.text();
      } catch(e){
        console.warn(e);
        return null;
      }
    }

    async function renderFromText(text){
      if(!text){ alert("Не могу да учитам CSV. Постави NOVI_BEOGRAD_V1.csv у исти фолдер или отпреми локално."); return; }
      const sample = text.slice(0,2000);
      const delim = (sample.match(/\t/g)||[]).length > (sample.match(/,/g)||[]).length ? "\t" : ",";
      const parsed = Papa.parse(text, { delimiter: delim, skipEmptyLines: true });
      if(!parsed || !parsed.data || parsed.data.length<1){ alert("CSV није правилан"); return; }
      const header = parsed.data[0].map(h=>h.trim());
      const rows = parsed.data.slice(1).filter(r=> r.some(c=> (c||"").toString().trim() !== "") );
      const objects = rows.map(r=>{
        const obj = {};
        for(let i=0;i<header.length;i++) obj[header[i]||("col"+i)] = r[i]!==undefined ? r[i] : "";
        return obj;
      });

      const container = document.getElementById("cards");
      container.innerHTML = "";
      objects.forEach(o => container.appendChild(renderCard(o)));
      applyFilters();
    }

    function applyFilters(){
      const q = document.getElementById("search").value.trim().toLowerCase();
      const type = document.getElementById("filterType").value.trim().toLowerCase();
      const cards = Array.from(document.querySelectorAll(".card"));
      cards.forEach(c=>{
        const matchesQ = !q || c.dataset.addr.includes(q) || (c.dataset.voters && c.dataset.voters.includes(q));
        const matchesType = !type || c.dataset.type.includes(type);
        c.style.display = (matchesQ && matchesType) ? "" : "none";
      });
    }

    document.getElementById("search").addEventListener("input", applyFilters);
    document.getElementById("filterType").addEventListener("change", applyFilters);
    document.getElementById("reload").addEventListener("click", async ()=>{
      const text = await loadCSVText();
      if(!text){
        // ako fetch ne radi, otvori file picker
        const fi = document.createElement("input");
        fi.type = "file";
        fi.accept = ".csv,text/csv,text/plain";
        fi.onchange = e => {
          const f = e.target.files[0];
          if(!f) return;
          const reader = new FileReader();
          reader.onload = ev => renderFromText(ev.target.result);
          reader.readAsText(f, "utf-8");
        };
        fi.click();
        return;
      }
      await renderFromText(text);
    });

    // automatsko učitavanje pri otvaranju
    (async ()=> {
      const text = await loadCSVText();
      if(text) await renderFromText(text);
    })();
  </script>
</body>
</html>
